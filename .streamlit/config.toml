# Streamlit config (committed; applies to anyone cloning the repo).

[server]
# Use polling-based file watcher instead of watchdog. Watchdog (the
# default) walks every imported module's source files and dies on
# Windows when our heavy dep tree (torch + torchvision + transformers
# + sentence-transformers + faster-whisper + piper-tts) hits Windows'
# file-handle / watch-path limits. Polling sidesteps that — it only
# checks file mtimes on a tick, doesn't open OS-level watch handles.
#
# Trade-off: code changes detected within a couple of seconds (vs
# instant with watchdog). Acceptable for our dev loop.
#
# If polling also misbehaves on your machine, set this to "none" to
# disable auto-reload entirely (then use restart.bat to relaunch).
fileWatcherType = "poll"

[browser]
# Disable telemetry pings (cleaner terminal output).
gatherUsageStats = false
